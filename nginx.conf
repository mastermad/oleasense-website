server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  error_page 404 /404.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Même chemin /api/ que le frontend de l'application : le compose local relaie vers le backend (formulaires du site).
  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $backend http://spring-backend:8080;
    proxy_pass $backend;
    # Hôte avec port : le backend reconnaît l'en-tête Origin du navigateur comme same-origin (sinon 403 CORS).
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
